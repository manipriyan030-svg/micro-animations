<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro Animations</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      padding: 12px;
      overflow-y: auto;
    }
    h1 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #fff; }
    .categories { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
    .cat-btn {
      padding: 4px 10px; border-radius: 12px; border: none;
      background: #333; color: #999; font-size: 11px; cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn.active, .cat-btn:hover { background: #00e5a0; color: #000; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; padding: 12px 8px; border-radius: 10px; border: 1px solid #333;
      background: #252525; cursor: pointer; transition: all 0.2s;
    }
    .card:hover { border-color: #00e5a044; background: #2a2a2a; }
    .card.selected { border-color: #00e5a0; background: #00e5a010; }
    .card svg { width: 28px; height: 28px; pointer-events: none; }
    .card-name { font-size: 9px; color: #888; text-align: center; line-height: 1.2; }
    .card-trigger { font-size: 8px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Customizer panel */
    .customizer { display: none; }
    .customizer.visible { display: block; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 0;
      background: none; border: none; color: #888; font-size: 11px;
      cursor: pointer; margin-bottom: 12px;
    }
    .back-btn:hover { color: #fff; }
    .preview-box {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; border-radius: 10px; border: 1px solid #333;
      background: #1a1a1a; margin-bottom: 12px; min-height: 100px;
    }
    .preview-box svg { pointer-events: none; }
    .anim-name { font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 2px; }
    .anim-meta { font-size: 10px; color: #666; text-align: center; margin-bottom: 12px; text-transform: capitalize; }

    .control-group { margin-bottom: 10px; }
    .control-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: #999; margin-bottom: 4px;
    }
    .control-value { font-family: monospace; font-size: 10px; color: #666; }
    .color-row { display: flex; align-items: center; gap: 8px; }
    input[type="color"] {
      -webkit-appearance: none; border: none; width: 28px; height: 28px;
      border-radius: 6px; cursor: pointer; background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 1px; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid #444; border-radius: 4px; }
    .color-swatches { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 6px; }
    .swatch {
      width: 18px; height: 18px; border-radius: 50%; border: 1px solid #444;
      cursor: pointer; transition: transform 0.15s;
    }
    .swatch:hover, .swatch.active { transform: scale(1.2); border-color: #fff; }
    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 3px;
      background: #333; border-radius: 2px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: #00e5a0; cursor: pointer;
    }
    .actions { display: flex; gap: 6px; margin-top: 14px; }
    .btn {
      flex: 1; padding: 8px; border-radius: 8px; border: none;
      font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary { background: #00e5a0; color: #000; }
    .btn-primary:hover { background: #00cc8e; }
    .btn-secondary { background: #333; color: #fff; }
    .btn-secondary:hover { background: #444; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status { font-size: 11px; text-align: center; padding: 8px; margin-top: 8px; border-radius: 6px; }
    .status.success { background: #00e5a020; color: #00e5a0; }
    .status.error { background: #ff444420; color: #ff4444; }
  </style>
</head>
<body>
  <!-- Grid View -->
  <div id="grid-view">
    <h1>Micro Animations</h1>
    <div class="categories" id="categories"></div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Customizer View -->
  <div id="customizer-view" class="customizer">
    <button class="back-btn" onclick="showGrid()">&#8592; Back</button>
    <div class="preview-box" id="preview"></div>
    <div class="anim-name" id="anim-name"></div>
    <div class="anim-meta" id="anim-meta"></div>

    <div class="control-group">
      <div class="control-label"><span>Color</span><span class="control-value" id="color-val">#00e5a0</span></div>
      <div class="color-row">
        <input type="color" id="color-input" value="#00e5a0" onchange="updateColor(this.value)">
      </div>
      <div class="color-swatches" id="swatches"></div>
    </div>

    <div class="control-group">
      <div class="control-label"><span>Size</span><span class="control-value" id="size-val">48px</span></div>
      <input type="range" min="16" max="128" value="48" id="size-input" oninput="updateSize(this.value)">
    </div>

    <div class="control-group">
      <div class="control-label"><span>Speed</span><span class="control-value" id="speed-val">1.0x</span></div>
      <input type="range" min="0.25" max="3" step="0.25" value="1" id="speed-input" oninput="updateSpeed(this.value)">
    </div>

    <div class="control-group">
      <div class="control-label"><span>Stroke Width</span><span class="control-value" id="stroke-val">2px</span></div>
      <input type="range" min="1" max="6" step="0.5" value="2" id="stroke-input" oninput="updateStroke(this.value)">
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="insertToWebflow()">Insert to Page</button>
      <button class="btn btn-secondary" onclick="uploadAsset()">Save as Asset</button>
    </div>
    <div id="status"></div>
  </div>

  <script>
    // Animation data
    const animations = [
      { id: 'hamburger-toggle', name: 'Hamburger', category: 'navigation', trigger: 'click',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" class="hamburger-toggle" onclick="this.classList.toggle('open')"><line x1="4" y1="6" x2="20" y2="6" class="line-top"/><line x1="4" y1="12" x2="20" y2="12" class="line-mid"/><line x1="4" y1="18" x2="20" y2="18" class="line-bot"/></svg>`,
        css: (o) => { const d=0.3/o.speed; return `.hamburger-toggle{cursor:pointer}.hamburger-toggle line{transition:all ${d}s ease;transform-origin:center}.hamburger-toggle.open .line-top{transform:rotate(45deg)}.hamburger-toggle.open .line-mid{opacity:0}.hamburger-toggle.open .line-bot{transform:rotate(-45deg)}`; }
      },
      { id: 'bell-alert', name: 'Bell Alert', category: 'feedback', trigger: 'auto-loop',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round"><g class="bell-icon"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></g></svg>`,
        css: (o) => `@keyframes bell-swing{0%,100%{transform:rotate(0deg)}15%{transform:rotate(12deg)}30%{transform:rotate(-10deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}.bell-icon{animation:bell-swing ${1/o.speed}s ease-in-out infinite;transform-origin:12px 2px}`
      },
      { id: 'spinner-dots', name: 'Spinner Dots', category: 'loading', trigger: 'auto-loop',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24"><circle class="dot d1" cx="5" cy="12" r="2.5" fill="${o.color}"/><circle class="dot d2" cx="12" cy="12" r="2.5" fill="${o.color}"/><circle class="dot d3" cx="19" cy="12" r="2.5" fill="${o.color}"/></svg>`,
        css: (o) => { const d=1.2/o.speed; return `@keyframes dot-bounce{0%,80%,100%{transform:scale(0);opacity:.5}40%{transform:scale(1);opacity:1}}.d1{animation:dot-bounce ${d}s ease-in-out infinite}.d2{animation:dot-bounce ${d}s ease-in-out ${d*0.16}s infinite}.d3{animation:dot-bounce ${d}s ease-in-out ${d*0.32}s infinite}`; }
      },
      { id: 'spinner-ring', name: 'Spinner Ring', category: 'loading', trigger: 'auto-loop',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none"><g class="spinner-ring"><circle class="spinner-path" cx="12" cy="12" r="9" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round"/></g></svg>`,
        css: (o) => { const d=1.5/o.speed; return `@keyframes spin{100%{transform:rotate(360deg)}}@keyframes dash{0%{stroke-dasharray:1,60;stroke-dashoffset:0}50%{stroke-dasharray:30,60;stroke-dashoffset:-10}100%{stroke-dasharray:1,60;stroke-dashoffset:-40}}.spinner-ring{animation:spin ${d}s linear infinite;transform-origin:center}.spinner-path{animation:dash ${d}s ease-in-out infinite}`; }
      },
      { id: 'checkmark', name: 'Checkmark', category: 'feedback', trigger: 'auto-play',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none"><circle class="check-circle" cx="12" cy="12" r="9" stroke="${o.color}" stroke-width="${o.strokeWidth}"/><path class="check-mark" d="M8 12l3 3 5-6" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        css: (o) => { const d=0.6/o.speed; return `@keyframes draw-circle{0%{stroke-dashoffset:60}100%{stroke-dashoffset:0}}@keyframes draw-check{0%{stroke-dashoffset:20}100%{stroke-dashoffset:0}}.check-circle{stroke-dasharray:60;animation:draw-circle ${d}s ease forwards}.check-mark{stroke-dasharray:20;stroke-dashoffset:20;animation:draw-check ${d*0.5}s ease ${d}s forwards}`; }
      },
      { id: 'close-x', name: 'Close X', category: 'navigation', trigger: 'hover',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" class="close-x"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>`,
        css: (o) => `.close-x{cursor:pointer;transition:transform ${0.3/o.speed}s ease}.close-x:hover{transform:rotate(90deg)}`
      },
      { id: 'arrow-right', name: 'Arrow Right', category: 'navigation', trigger: 'hover',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="arrow-right"><g class="arrow-group"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></g></svg>`,
        css: (o) => `.arrow-right{cursor:pointer}.arrow-right .arrow-group{transition:transform ${0.4/o.speed}s ease}.arrow-right:hover .arrow-group{transform:translateX(3px)}`
      },
      { id: 'arrow-down', name: 'Arrow Down', category: 'toggle', trigger: 'click',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="chevron-toggle" onclick="this.classList.toggle('open')"><polyline points="6 9 12 15 18 9" class="chevron-path"/></svg>`,
        css: (o) => `.chevron-toggle{cursor:pointer}.chevron-path{transition:transform ${0.3/o.speed}s ease;transform-origin:center}.chevron-toggle.open .chevron-path{transform:rotate(180deg)}`
      },
      { id: 'heart-like', name: 'Heart Like', category: 'action', trigger: 'click',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" class="heart-toggle" onclick="this.classList.toggle('liked')"><path class="heart-path" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        css: (o) => `@keyframes heart-pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}.heart-path{transform-origin:center;transition:fill ${0.3/o.speed}s ease}.heart-toggle{cursor:pointer}.heart-toggle.liked .heart-path{fill:${o.color};animation:heart-pop ${0.3/o.speed}s ease}`
      },
      { id: 'search-icon', name: 'Search', category: 'navigation', trigger: 'click',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" class="search-icon" onclick="this.classList.toggle('active')"><circle class="search-circle" cx="11" cy="11" r="7"/><line class="search-line" x1="16.5" y1="16.5" x2="21" y2="21"/></svg>`,
        css: (o) => `.search-icon{cursor:pointer}.search-circle{transition:all ${0.4/o.speed}s ease;transform-origin:center}.search-line{transition:all ${0.4/o.speed}s ease}.search-icon.active .search-circle{opacity:0;transform:scale(0)}`
      },
      { id: 'play-pause', name: 'Play / Pause', category: 'toggle', trigger: 'click',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="play-pause" onclick="this.classList.toggle('playing')"><polygon class="play-icon" points="6 3 20 12 6 21 6 3" fill="${o.color}"/><g class="pause-icon" style="display:none"><line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/></g></svg>`,
        css: (o) => `.play-pause{cursor:pointer}.play-pause .play-icon,.play-pause .pause-icon{transition:all ${0.3/o.speed}s ease}.play-pause.playing .play-icon{display:none}.play-pause.playing .pause-icon{display:block}`
      },
      { id: 'download-icon', name: 'Download', category: 'action', trigger: 'hover',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="download-icon"><g class="dl-arrow"><path d="M12 5v10"/><polyline points="8 11 12 15 16 11"/></g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>`,
        css: (o) => `@keyframes dl-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}.download-icon{cursor:pointer}.download-icon:hover .dl-arrow{animation:dl-bounce ${0.5/o.speed}s ease infinite}`
      },
      { id: 'copy-clipboard', name: 'Copy', category: 'action', trigger: 'click',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="copy-icon"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
        css: (o) => `.copy-icon{cursor:pointer;transition:all ${0.3/o.speed}s ease}.copy-icon:active{transform:scale(0.9)}`
      },
      { id: 'trash-delete', name: 'Trash', category: 'action', trigger: 'hover',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="trash-icon"><g class="lid"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></g><g class="can"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></g></svg>`,
        css: (o) => `.trash-icon{cursor:pointer}.trash-icon .lid{transition:transform ${0.3/o.speed}s ease;transform-origin:center 6px}.trash-icon:hover .lid{transform:rotate(-15deg) translateY(-2px)}.trash-icon .can{transition:transform ${0.3/o.speed}s ease}.trash-icon:hover .can{transform:translateX(1px)}`
      },
      { id: 'settings-gear', name: 'Settings', category: 'action', trigger: 'hover',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="gear-icon"><g class="gear-g"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></g></svg>`,
        css: (o) => `.gear-icon{cursor:pointer}.gear-g{transition:transform ${2/o.speed}s ease;transform-origin:center}.gear-icon:hover .gear-g{transform:rotate(180deg)}`
      },
      { id: 'eye-visibility', name: 'Eye Toggle', category: 'toggle', trigger: 'click',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="eye-toggle" onclick="this.classList.toggle('hidden-eye')"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line class="slash" x1="1" y1="1" x2="23" y2="23" style="display:none"/></svg>`,
        css: (o) => `.eye-toggle{cursor:pointer}.eye-toggle *{transition:all ${0.3/o.speed}s ease}.eye-toggle.hidden-eye .slash{display:block!important}`
      },
      { id: 'notification-badge', name: 'Notification', category: 'feedback', trigger: 'auto-loop',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 24 24" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><circle class="notif-ping" cx="18" cy="5" r="3"/><circle class="notif-dot" cx="18" cy="5" r="3"/></svg>`,
        css: (o) => { const d=2/o.speed; return `@keyframes notif-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}@keyframes notif-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.5);opacity:0}}.notif-dot{fill:${o.color};stroke:none;transform-origin:18px 5px;animation:notif-pulse ${d}s ease-in-out infinite}.notif-ping{fill:${o.color};stroke:none;transform-origin:18px 5px;animation:notif-ping ${d}s ease-out infinite}`; }
      },
      { id: 'loading-bar', name: 'Loading Bar', category: 'loading', trigger: 'auto-loop',
        svg: (o) => `<svg width="${o.size}" height="${o.size}" viewBox="0 0 48 48"><rect class="bar-track" x="4" y="20" width="40" height="4" rx="2"/><rect class="bar-fill" x="4" y="20" width="20" height="4" rx="2"/></svg>`,
        css: (o) => `@keyframes bar-slide{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}.bar-track{fill:${o.color};opacity:.15}.bar-fill{fill:${o.color};animation:bar-slide ${1.5/o.speed}s ease-in-out infinite}`
      },
    ];

    const categories = ['all','navigation','feedback','loading','action','toggle'];
    const swatchColors = ['#00e5a0','#3b82f6','#ef4444','#f59e0b','#a855f7','#ec4899','#14b8a6','#f97316','#8b5cf6','#ffffff'];

    let currentFilter = 'all';
    let selectedAnim = null;
    let opts = { color: '#00e5a0', size: 48, speed: 1, strokeWidth: 2 };

    // Render categories
    function renderCategories() {
      const el = document.getElementById('categories');
      el.innerHTML = categories.map(c =>
        `<button class="cat-btn ${c === currentFilter ? 'active' : ''}" onclick="filterCategory('${c}')">${c === 'all' ? 'All' : c.charAt(0).toUpperCase() + c.slice(1)}</button>`
      ).join('');
    }

    // Render grid
    function renderGrid() {
      const el = document.getElementById('grid');
      const filtered = currentFilter === 'all' ? animations : animations.filter(a => a.category === currentFilter);
      el.innerHTML = filtered.map(a => {
        const previewOpts = { color: '#00e5a0', size: 28, speed: 1, strokeWidth: 2 };
        return `<div class="card" onclick="selectAnimation('${a.id}')">
          ${a.svg(previewOpts)}
          <div class="card-name">${a.name}</div>
          <div class="card-trigger">${a.trigger}</div>
        </div>`;
      }).join('');
    }

    function filterCategory(cat) {
      currentFilter = cat;
      renderCategories();
      renderGrid();
    }

    function selectAnimation(id) {
      selectedAnim = animations.find(a => a.id === id);
      opts = { color: '#00e5a0', size: 48, speed: 1, strokeWidth: 2 };
      document.getElementById('grid-view').style.display = 'none';
      document.getElementById('customizer-view').classList.add('visible');
      renderCustomizer();
    }

    function showGrid() {
      selectedAnim = null;
      document.getElementById('grid-view').style.display = 'block';
      document.getElementById('customizer-view').classList.remove('visible');
      document.getElementById('status').innerHTML = '';
    }

    function renderCustomizer() {
      if (!selectedAnim) return;
      document.getElementById('preview').innerHTML = `<style>${selectedAnim.css(opts)}</style>${selectedAnim.svg(opts)}`;
      document.getElementById('anim-name').textContent = selectedAnim.name;
      document.getElementById('anim-meta').textContent = `${selectedAnim.trigger} \u00B7 ${selectedAnim.category}`;
      document.getElementById('color-input').value = opts.color;
      document.getElementById('color-val').textContent = opts.color;
      document.getElementById('size-input').value = opts.size;
      document.getElementById('size-val').textContent = opts.size + 'px';
      document.getElementById('speed-input').value = opts.speed;
      document.getElementById('speed-val').textContent = opts.speed.toFixed(1) + 'x';
      document.getElementById('stroke-input').value = opts.strokeWidth;
      document.getElementById('stroke-val').textContent = opts.strokeWidth + 'px';

      // Swatches
      document.getElementById('swatches').innerHTML = swatchColors.map(c =>
        `<div class="swatch ${c === opts.color ? 'active' : ''}" style="background:${c}" onclick="updateColor('${c}')"></div>`
      ).join('');
    }

    function updateColor(v) { opts.color = v; renderCustomizer(); }
    function updateSize(v) { opts.size = parseInt(v); renderCustomizer(); }
    function updateSpeed(v) { opts.speed = parseFloat(v); renderCustomizer(); }
    function updateStroke(v) { opts.strokeWidth = parseFloat(v); renderCustomizer(); }

    function showStatus(msg, type) {
      document.getElementById('status').innerHTML = `<div class="status ${type}">${msg}</div>`;
      if (type === 'success') setTimeout(() => { document.getElementById('status').innerHTML = ''; }, 3000);
    }

    // Insert animation as HTML Embed into the Webflow canvas
    async function insertToWebflow() {
      if (!selectedAnim) return;
      try {
        const el = await webflow.getSelectedElement();
        if (!el) {
          showStatus('Select an element on the canvas first', 'error');
          return;
        }

        const htmlCode = `<style>${selectedAnim.css(opts)}</style>${selectedAnim.svg(opts)}`;

        // Insert an HtmlEmbed element after the selected element
        const embed = await el.after(webflow.elementPresets.HtmlEmbed);
        if (embed && embed.setHTML) {
          await embed.setHTML(htmlCode);
          await embed.save();
        }

        showStatus('Animation inserted!', 'success');
      } catch (err) {
        console.error('Insert error:', err);
        showStatus('Failed to insert: ' + err.message, 'error');
      }
    }

    // Upload animation as SVG asset
    async function uploadAsset() {
      if (!selectedAnim) return;
      try {
        const svgCode = `<?xml version="1.0" encoding="UTF-8"?>${selectedAnim.svg(opts)}`;
        const blob = new Blob([svgCode], { type: 'image/svg+xml' });
        const file = new File([blob], `${selectedAnim.id}.svg`, { type: 'image/svg+xml' });
        await webflow.createAsset(file);
        showStatus('Asset saved to your site!', 'success');
      } catch (err) {
        console.error('Upload error:', err);
        showStatus('Failed to save asset: ' + err.message, 'error');
      }
    }

    // Init
    renderCategories();
    renderGrid();
  </script>
</body>
</html>
